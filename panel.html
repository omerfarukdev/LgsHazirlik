<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LGS İlerleme Paneli</title>
<link rel="stylesheet" href="css/style.css?v=20260919c">
</head>
<body>
<div id="app"><div class="yukleniyor">Yükleniyor…</div></div>
<script src="js/ayar.js?v=20260919c"></script>
<script src="js/konular.js?v=20260919c"></script>
<script src="sorular/manifest.js?v=20260919c"></script>
<script src="js/app.js?v=20260919c"></script>
<script src="js/panel.js?v=20260919c"></script>
<script>
(function () {
  var files = window.LGS_MANIFEST || [];
  var kalan = files.length;
  if (!kalan) { Panel.yukle(); return; }
  files.forEach(function (f) {
    var s = document.createElement("script");
    s.src = "sorular/" + f + "?v=20260919c";
    s.async = false;
    s.onload = s.onerror = function () { if (--kalan === 0) Panel.yukle(); };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
