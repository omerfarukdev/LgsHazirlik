<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121d3a">
<title>LGS Hazırlık</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20260922c">
</head>
<body>
<div id="app"><div class="yukleniyor">Sorular yükleniyor…</div></div>
<script src="js/ayar.js?v=20260922c"></script>
<script src="js/konular.js?v=20260922c"></script>
<script src="js/takvim.js?v=20260922c"></script>
<script src="sorular/manifest.js?v=20260922c"></script>
<script src="hap/liste.js?v=20260922c"></script>
<script src="js/app.js?v=20260922c"></script>
<script>
(function () {
  // Soru dosyaları ve konu özetleri (hap bilgi) aynı sırayla yüklenir
  var files = (window.LGS_MANIFEST || []).map(function (f) { return "sorular/" + f; })
    .concat((window.LGS_HAP_LISTE || []).map(function (f) { return "hap/" + f; }));
  var kalan = files.length;
  if (!kalan) { App.init(); return; }
  files.forEach(function (f) {
    var s = document.createElement("script");
    s.src = f + "?v=20260922c";
    s.async = false; // dosyalar manifest sırasıyla çalışsın (soru sırası buna bağlı)
    s.onload = s.onerror = function () { if (--kalan === 0) App.init(); };
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
